<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>🎬 MovieBook</h1>

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn">

                Register

            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>


<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const response = await fetch(
        "/api/auth/register",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                email,
                password
            })
        }
    );


    const data = await response.json();


    document.getElementById("message")
        .innerText = data.message;


    if (response.ok) {

        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1000);

    }

});

</script>

</body>

</html>
