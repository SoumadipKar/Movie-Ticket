<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Select Seats</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        🎬 MovieBook
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="movies.html">Movies</a>

        <a href="my-bookings.html">
            My Bookings
        </a>

    </nav>

</header>


<div class="container">

    <h1>Select Your Seats</h1>


    <div class="screen">
        SCREEN
    </div>


    <div id="seatContainer"
         class="seats">

    </div>


    <div class="booking-summary">

        <p>
            Selected:
            <span id="selectedSeats">
                None
            </span>
        </p>

        <p>
            Total:
            ₹<span id="total">0</span>
        </p>

        <button
            onclick="continueBooking()"
            class="btn">

            Continue

        </button>

    </div>

</div>


<script src="js/seats.js"></script>

</body>

</html>
