<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        🎬 MovieBook
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="movies.html">Movies</a>

        <a href="my-bookings.html">
            My Bookings
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<div class="container">

    <h1>My Bookings</h1>

    <div id="bookings">

        Loading...

    </div>

</div>


<script>

const user =
    JSON.parse(localStorage.getItem("user"));


if (!user) {

    window.location.href =
        "login.html";

}


fetch(
    `/api/bookings/user/${user.id}`
)

.then(response => response.json())

.then(bookings => {

    const container =
        document.getElementById("bookings");


    if (bookings.length === 0) {

        container.innerHTML =
            "<p>No bookings found.</p>";

        return;

    }


    container.innerHTML =
        bookings.map(booking => `

            <div class="booking-card">

                <h2>
                    ${booking.movieId.title}
                </h2>

                <p>
                    Theatre:
                    ${booking.theatreId.name}
                </p>

                <p>
                    Date:
                    ${booking.showId.showDate}
                </p>

                <p>
                    Time:
                    ${booking.showId.showTime}
                </p>

                <p>
                    Seats:
                    ${booking.seats.join(", ")}
                </p>

                <p>
                    Amount:
                    ₹${booking.totalAmount}
                </p>

                <p>
                    Status:
                    ${booking.status}
                </p>

            </div>

        `).join("");

});

</script>

</body>

</html>
